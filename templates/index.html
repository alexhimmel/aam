<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAM - 自动化任务管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- 导航栏 -->
        <nav class="bg-white shadow mb-8">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">
                        🔧 AAM - 自动化任务管理 v0.2
                    </h1>
                    <div class="space-x-4">
                        <a href="#tasks" class="text-blue-600 hover:text-blue-800">任务列表</a>
                        <a href="#schedule" class="text-blue-600 hover:text-blue-800">定时任务</a>
                        <a href="#executions" class="text-blue-600 hover:text-blue-800">执行记录</a>
                        <a href="#notifications" class="text-blue-600 hover:text-blue-800">通知配置</a>
                        <a href="#statistics" class="text-blue-600 hover:text-blue-800">统计报表</a>
                    </div>
                </div>
            </div>
        </nav>
        
        <!-- 统计概览 -->
        <div id="statistics-overview" class="mb-8">
            <h2 class="text-xl font-semibold mb-4">📊 统计概览</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <div id="overview-content" class="space-y-4">
                    <p class="text-gray-600">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- 任务列表 -->
        <div id="tasks" class="mb-8">
            <h2 class="text-xl font-semibold mb-4">📋 任务列表</h2>
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 动态加载任务 -->
            </div>
        </div>
        
        <!-- 新增任务表单 -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">➕ 新增任务</h2>
            <form id="add-task-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700">任务名称</label>
                    <input type="text" name="name" required 
                           class="w-full border rounded p-2"
                           placeholder="例如：系统监控">
                </div>
                <div>
                    <label class="block text-gray-700">执行命令</label>
                    <textarea name="command" required rows="3" 
                              class="w-full border rounded p-2"
                              placeholder="例如：uptime, df -h, systemctl status nginx"></textarea>
                </div>
                <div>
                    <label class="block text-gray-700">目标主机（逗号分隔）</label>
                    <input type="text" name="hosts" required 
                           class="w-full border rounded p-2"
                           placeholder="192.168.1.1,192.168.1.2,192.168.1.3">
                </div>
                <div>
                    <label class="block text-gray-700">定时计划（Cron 表达式）</label>
                    <input type="text" name="schedule" 
                           class="w-full border rounded p-2"
                           placeholder="例如：0 2 * * * 每天 2 点执行">
                </div>
                <div>
                    <label class="block text-gray-700">任务类型</label>
                    <select name="task_type" class="w-full border rounded p-2">
                        <option value="command">命令</option>
                        <option value="脚本">脚本</option>
                        <option value="文件">文件</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700">工作目录</label>
                    <input type="text" name="working_dir" 
                           class="w-full border rounded p-2"
                           placeholder="例如：/opt/scripts">
                </div>
                <div>
                    <label class="block text-gray-700">上传目录</label>
                    <input type="text" name="upload_dir" 
                           class="w-full border rounded p-2"
                           placeholder="例如：/tmp/upload">
                </div>
                <button type="submit" 
                        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    创建任务
                </button>
            </form>
        </div>
        
        <!-- 通知配置 -->
        <div id="notifications" class="mb-8">
            <h2 class="text-xl font-semibold mb-4">🔔 通知配置</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="space-y-6">
                    <!-- 邮件通知 -->
                    <div>
                        <h3 class="font-semibold mb-3">📧 邮件通知</h3>
                        <div class="space-y-3">
                            <div class="flex items-center">
                                <input type="checkbox" id="email-enabled" 
                                       class="h-5 w-5 text-blue-600"
                                       checked>
                                <label for="email-enabled" class="ml-2 text-gray-700">启用邮件通知</label>
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">SMTP 服务器</label>
                                <input type="text" id="smtp-server" 
                                       class="w-full border rounded p-2"
                                       placeholder="smtp.example.com">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">SMTP 端口</label>
                                <input type="number" id="smtp-port" value="587"
                                       class="w-32 border rounded p-2">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">用户名</label>
                                <input type="text" id="email-username" 
                                       class="w-full border rounded p-2"
                                       placeholder="your@email.com">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">密码</label>
                                <input type="password" id="email-password" 
                                       class="w-full border rounded p-2"
                                       placeholder="your_password">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">发送者</label>
                                <input type="text" id="email-from" 
                                       class="w-full border rounded p-2"
                                       placeholder="aam@example.com">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">接收者</label>
                                <input type="text" id="email-to" 
                                       class="w-full border rounded p-2"
                                       placeholder="admin@example.com">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Webhook 通知 -->
                    <div>
                        <h3 class="font-semibold mb-3">🔗 Webhook 通知</h3>
                        <div class="space-y-3">
                            <div class="flex items-center">
                                <input type="checkbox" id="webhook-enabled" 
                                       class="h-5 w-5 text-blue-600">
                                <label for="webhook-enabled" class="ml-2 text-gray-700">启用 Webhook 通知</label>
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">Webhook URL</label>
                                <input type="text" id="webhook-url" 
                                       class="w-full border rounded p-2"
                                       placeholder="https://hooks.slack.com/services/...">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm">平台类型</label>
                                <select id="webhook-platform" class="w-full border rounded p-2">
                                    <option value="slack">Slack</option>
                                    <option value="discord">Discord</option>
                                    <option value="dingtalk">钉钉</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 保存按钮 -->
                    <button id="save-notifications" 
                            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        保存配置
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 执行记录 -->
        <div id="executions" class="mb-8">
            <h2 class="text-xl font-semibold mb-4">📊 执行记录</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-600">暂无执行记录</p>
            </div>
        </div>
        
        <!-- 统计报表 -->
        <div id="statistics-detailed" class="mb-8">
            <h2 class="text-xl font-semibold mb-4">📈 详细统计报表</h2>
            <div class="bg-white p-6 rounded-lg shadow">
                <div id="statistics-content" class="space-y-4">
                    <p class="text-gray-600">加载中...</p>
                </div>
            </div>
        </div>
        
    </div>
    
    <script>
        // 加载统计概览
        async function loadOverview() {
            try {
                const response = await fetch('/api/v1/tasks/statistics/overview');
                const data = await response.json();
                
                const html = `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <div class="text-3xl font-bold text-blue-600">${data.total}</div>
                            <div class="text-gray-600">总任务数</div>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg">
                            <div class="text-3xl font-bold text-green-600">${data.success}</div>
                            <div class="text-gray-600">成功</div>
                        </div>
                        <div class="bg-red-50 p-4 rounded-lg">
                            <div class="text-3xl font-bold text-red-600">${data.failed}</div>
                            <div class="text-gray-600">失败</div>
                        </div>
                        <div class="bg-purple-50 p-4 rounded-lg">
                            <div class="text-3xl font-bold text-purple-600">${data.success_rate}%</div>
                            <div class="text-gray-600">成功率</div>
                        </div>
                    </div>
                `;
                document.getElementById('overview-content').innerHTML = html;
            } catch (error) {
                console.error('加载概览失败:', error);
                document.getElementById('overview-content').innerHTML = 
                    '<p class="text-red-600">加载失败，请检查 API 服务</p>';
            }
        }
        
        // 加载详细统计
        async function loadStatistics() {
            try {
                const response = await fetch('/api/v1/tasks/statistics/json');
                const data = await response.json();
                
                let html = '<div class="space-y-4">';
                
                // 类型统计
                html += '<div><h3 class="font-semibold mb-2">按任务类型</h3>';
                html += '<table class="w-full">';
                html += '<thead><tr><th>类型</th><th>任务数</th><th>成功数</th></tr></thead>';
                html += '<tbody>';
                for (const [type, stats] of Object.entries(data.type)) {
                    html += `<tr><td>${type}</td><td>${stats.count}</td><td>${stats.success}</td></tr>`;
                }
                html += '</tbody></table></div>';
                
                // 主机统计
                html += '<div><h3 class="font-semibold mb-2">活跃主机（前 10）</h3>';
                html += '<table class="w-full">';
                html += '<thead><tr><th>主机</th><th>任务数</th><th>成功率</th></tr></thead>';
                html += '<tbody>';
                data.hosts.forEach(host => {
                    html += `<tr><td>${host.host}</td><td>${host.total}</td><td>${host.success_rate}%</td></tr>`;
                });
                html += '</tbody></table></div>';
                
                html += '</div>';
                document.getElementById('statistics-content').innerHTML = html;
            } catch (error) {
                console.error('加载统计失败:', error);
                document.getElementById('statistics-content').innerHTML = 
                    '<p class="text-red-600">加载失败，请检查 API 服务</p>';
            }
        }
        
        // 保存通知配置
        document.getElementById('save-notifications').addEventListener('click', async () => {
            const emailConfig = {
                enabled: document.getElementById('email-enabled').checked,
                smtp_server: document.getElementById('smtp-server').value,
                smtp_port: parseInt(document.getElementById('smtp-port').value),
                username: document.getElementById('email-username').value,
                password: document.getElementById('email-password').value,
                from: document.getElementById('email-from').value,
                to: document.getElementById('email-to').value
            };
            
            const webhookConfig = {
                enabled: document.getElementById('webhook-enabled').checked,
                url: document.getElementById('webhook-url').value,
                platform: document.getElementById('webhook-platform').value
            };
            
            const config = {
                email: emailConfig,
                webhook: webhookConfig
            };
            
            try {
                // 这里需要更新配置文件，实际项目中应该通过 API 保存
                const response = await fetch('/api/v1/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                
                if (response.ok) {
                    alert('配置已保存！');
                } else {
                    alert('保存失败，请查看控制台');
                }
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        });
        
        // 页面加载时初始化
        loadOverview();
        loadStatistics();
    </script>
</body>
</html>
