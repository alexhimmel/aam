[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aam"
version = "0.1.0"
description = "Automated Task Management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.0",
    "python-dateutil>=2.8.2",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "pynacl>=1.5.0",
    "starlette>=0.27.0",
    "httpx>=0.25.0",
    "annotated-doc>=0.0.1",
    "email-validator>=2.0.0",
    "typing-extensions>=4.0.0",
    "APScheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "redis>=5.0.0",
    "celery>=5.3.0",
]

[tool.setuptools.packages.find]
include = ["app*", "init_db*"]
